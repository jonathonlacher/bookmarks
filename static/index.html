<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Bookmarks</h1>
        <p class="subtitle">Your centralized bookmark collection</p>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search bookmarks... (name, description, or URL)"
            autocomplete="off"
        >

        <div id="bookmarksContainer"></div>
        <div id="noResults" class="no-results hidden">No bookmarks found</div>
    </div>

    <script>
        let allBookmarks = [];

        // Fetch bookmarks on page load
        async function loadBookmarks() {
            try {
                const response = await fetch('/api/bookmarks');
                const data = await response.json();
                allBookmarks = data.groups || [];
                displayBookmarks(allBookmarks);
            } catch (error) {
                console.error('Failed to load bookmarks:', error);
            }
        }

        // Display bookmarks
        function displayBookmarks(groups) {
            const container = document.getElementById('bookmarksContainer');
            const noResults = document.getElementById('noResults');

            container.innerHTML = '';

            if (!groups || groups.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }

            let hasVisibleBookmarks = false;

            groups.forEach(group => {
                if (!group.bookmarks || group.bookmarks.length === 0) return;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'group';

                const groupTitle = document.createElement('div');
                groupTitle.className = 'group-name';
                groupTitle.textContent = group.name;
                groupDiv.appendChild(groupTitle);

                const table = document.createElement('table');
                table.className = 'bookmarks-table';

                const thead = document.createElement('thead');
                thead.innerHTML = `
                    <tr>
                        <th>Name</th>
                        <th>URL</th>
                        <th>Description</th>
                        <th>Shortcode</th>
                    </tr>
                `;
                table.appendChild(thead);

                const tbody = document.createElement('tbody');

                group.bookmarks.forEach(bookmark => {
                    hasVisibleBookmarks = true;
                    const row = createBookmarkRow(bookmark);
                    tbody.appendChild(row);
                });

                table.appendChild(tbody);
                groupDiv.appendChild(table);
                container.appendChild(groupDiv);
            });

            noResults.classList.toggle('hidden', hasVisibleBookmarks);
        }

        // Create bookmark table row
        function createBookmarkRow(bookmark) {
            const tr = document.createElement('tr');

            // Name column
            const tdName = document.createElement('td');
            tdName.className = 'col-name';
            const link = document.createElement('a');
            link.href = bookmark.url;
            link.textContent = bookmark.name;
            link.target = '_blank';
            link.className = 'bookmark-link';
            tdName.appendChild(link);
            tr.appendChild(tdName);

            // URL column
            const tdUrl = document.createElement('td');
            tdUrl.className = 'col-url';
            tdUrl.textContent = bookmark.url;
            tr.appendChild(tdUrl);

            // Description column
            const tdDesc = document.createElement('td');
            tdDesc.className = 'col-description';
            tdDesc.textContent = bookmark.description || '—';
            tr.appendChild(tdDesc);

            // Shortcode column
            const tdShortcode = document.createElement('td');
            tdShortcode.className = 'col-shortcode';
            if (bookmark.shortcode) {
                const span = document.createElement('span');
                span.className = 'bookmark-shortcode';
                span.textContent = '/s/' + bookmark.shortcode;
                tdShortcode.appendChild(span);
            } else {
                tdShortcode.textContent = '—';
            }
            tr.appendChild(tdShortcode);

            return tr;
        }

        // Simple fuzzy search implementation
        function fuzzyMatch(text, query) {
            if (!query) return true;

            text = text.toLowerCase();
            query = query.toLowerCase();

            // Simple substring match for performance
            return text.includes(query);
        }

        // Filter bookmarks based on search query
        function filterBookmarks(query) {
            if (!query.trim()) {
                displayBookmarks(allBookmarks);
                return;
            }

            const filtered = allBookmarks.map(group => {
                const matchingBookmarks = group.bookmarks.filter(bookmark => {
                    const searchText = [
                        bookmark.name,
                        bookmark.description || '',
                        bookmark.url,
                        bookmark.shortcode || ''
                    ].join(' ');

                    return fuzzyMatch(searchText, query);
                });

                return matchingBookmarks.length > 0
                    ? { ...group, bookmarks: matchingBookmarks }
                    : null;
            }).filter(Boolean);

            displayBookmarks(filtered);
        }

        // Setup search input handler
        document.getElementById('searchInput').addEventListener('input', (e) => {
            filterBookmarks(e.target.value);
        });

        // Load bookmarks on page load
        loadBookmarks();
    </script>
</body>
</html>
